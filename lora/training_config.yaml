job: extension
config:
  name: h3upscale_v2_x2
  process:
  - type: diffusion_trainer
    training_folder: /workspace/ai-toolkit/output
    sqlite_db_path: ./aitk_db.db
    device: cuda
    trigger_word: null
    network:
      type: lora
      linear: 64
      linear_alpha: 64
      network_kwargs:
        ignore_if_contains:
        - adaln_proj
    save:
      dtype: bf16
      save_every: 500
      max_step_saves_to_keep: 4
      save_format: diffusers
      push_to_hub: false
    datasets:
    - folder_path: /workspace/ai-toolkit/datasets/h3upscale_images_targets
      control_path_1: /workspace/ai-toolkit/datasets/h3upscale_images_guide_sources
      control_role_1: guide
      caption_ext: txt
      caption_dropout_rate: 0
      cache_text_embeddings: true
      cache_latents_to_disk: true
      resolution:
      - 1024
      num_frames: 1
      auto_frame_count: false
      flip_x: false
      flip_y: false
      random_crop: false
    - folder_path: /workspace/ai-toolkit/datasets/h3upscale_videos_targets
      control_path_1: /workspace/ai-toolkit/datasets/h3upscale_videos_guide_sources
      control_role_1: guide
      caption_ext: txt
      caption_dropout_rate: 0
      cache_text_embeddings: true
      cache_latents_to_disk: true
      resolution:
      - 1024
      num_frames: 5
      auto_frame_count: false
      shrink_video_to_frames: true
      fps: 24
      do_audio: false
      flip_x: false
      flip_y: false
      random_crop: false
    train:
      batch_size: 1
      steps: 4000
      gradient_accumulation: 1
      train_unet: true
      train_text_encoder: false
      gradient_checkpointing: true
      noise_scheduler: flowmatch
      optimizer: automagic3
      optimizer_params:
        weight_decay: 0.0001
      lr: 0.0001
      dtype: bf16
      cache_text_embeddings: true
      timestep_type: shift
      loss_type: mse
      audio_loss_multiplier: 0
      disable_sampling: false
    model:
      name_or_path: Comfy-Org/MiniMax-H3
      arch: minimax_h3_ref2va
      quantize: true
      qtype: convrot8
      quantize_te: true
      qtype_te: nvfp4
      low_vram: true
      assistant_lora_path: ostris/minimax_h3_training_adapter/minimax_h3_ref2va_training_adapter_v2.safetensors
      model_kwargs:
        align_video_refs: true
        align_image_refs: true
        image_guide_channel: 1
        guide_latent_only: true
        control_latent_only: false
        reference_downscale_factor: 2
        reference_dropout: 0
        guide_dropout: 0
        auxiliary_losses: []
        sample_audio: false
    sample:
      neg: ''
      sampler: flowmatch
      sample_every: 500
      width: 1024
      height: 768
      num_frames: 1
      fps: 24
      guidance_scale: 1
      sample_steps: 28
      seed: 42
      walk_seed: false
      samples:
      - prompt: h3upscale, increase resolution and restore fine details while preserving
          the original content and visual style.
        ctrl_img_1: /workspace/holdout/img_0002_2hBUvhe81mU.jpg
        ctrl_role_1: guide
meta:
  name: h3upscale_v2_x2
  version: '1.0'
